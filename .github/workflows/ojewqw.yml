name: PR Comment Echo

on:
  issue_comment:
    types: [created]

jobs:
  echo-readme:
    if: github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Echo README
        run: cat README.md